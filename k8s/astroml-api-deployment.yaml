apiVersion: apps/v1
kind: Deployment
metadata:
  name: astroml-api
  namespace: astroml
  labels:
    app: astroml-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: astroml-api
  template:
    metadata:
      labels:
        app: astroml-api
    spec:
      serviceAccountName: astroml
      containers:
      - name: api
        image: ghcr.io/${{ github.repository }}:production-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: astroml-config
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: astroml-config
              key: REDIS_URL
        - name: LLM_PROVIDER
          value: "openai"
        - name: ASTROML_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/llm/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 3
